<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOXEL - My Game</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#000;color:#fff;max-width:420px;margin:0 auto;font-family:sans-serif;padding-bottom:80px">

<div id="wallet">
<div style="background:radial-gradient(ellipse at top,#2a1a4a 0%,#000 70%);padding:30px 20px;text-align:center">
<div style="font-size:56px;font-weight:900"><span style="color:#555">$</span>350.24</div>
<div style="display:flex;justify-content:space-between;margin-top:28px">
<div style="text-align:center"><div style="width:56px;height:56px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">↓</div><div style="font-size:11px;margin-top:6px;color:#aaa">Deposit</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">↑</div><div style="font-size:11px;margin-top:6px;color:#aaa">Withdraw</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">⇄</div><div style="font-size:11px;margin-top:6px;color:#aaa">Exchange</div></div>
<div style="text-align:center"><div style="width:56px;height:56px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">🕐</div><div style="font-size:11px;margin-top:6px;color:#aaa">History</div></div>
</div>
</div>
<div style="padding:20px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px;background:#222;border-radius:10px;display:flex;align-items:center;justify-content:center">⬢</div><div><div style="font-weight:bold">VOXEL</div><div style="font-size:12px;color:#777">4518902 VOXEL</div></div></div><div style="text-align:right"><div style="font-weight:bold">$347.96</div><div style="font-size:12px;color:#9f9">$0.000077</div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px;background:#0098EA;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900">T</div><div><div style="font-weight:bold">TON</div><div style="font-size:12px;color:#777">0.604 TON</div></div></div><div style="text-align:right"><div style="font-weight:bold">$1.96</div><div style="font-size:12px;color:#f8a">$3.251 (-0.23%)</div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:28px;width:40px;text-align:center">⭐</div><div><div style="font-weight:bold">STARS</div><div style="font-size:12px;color:#777">4 STARS</div></div></div><div style="text-align:right"><div style="font-weight:bold">$0.05</div><div style="font-size:12px;color:#9f9">$0.013</div></div></div>
</div>
</div>

<div id="build" style="display:none">
<div style="padding:20px;text-align:center"><div style="background:#a3ff12;color:#000;padding:6px 20px;border-radius:20px;font-weight:900;display:inline-block;font-size:13px">PHASE 5 STARTED</div><div style="margin-top:14px;border:1px solid #333;border-radius:30px;padding:10px 18px;display:flex;align-items:center;gap:10px;justify-content:center"><span>⭐</span><b style="font-size:22px">⬢ 4698884</b><span style="width:32px;height:32px;background:#0af;border-radius:50%;display:flex;align-items:center;justify-content:center">+</span><span style="margin-left:auto">⚙️</span></div></div>
<div style="height:400px;position:relative;text-align:center"><div style="position:absolute;left:20px;top:20px"><div style="width:70px;height:70px;background:linear-gradient(#4af,#0ff);border-radius:50%;font-size:36px;display:flex;align-items:center;justify-content:center">🏆</div><div style="background:#000;border:1px solid #fff;border-radius:20px;font-size:11px;margin-top:-8px">〰️ 4862</div></div><div style="position:absolute;right:20px;top:20px"><div style="width:70px;height:70px;background:#111;border:1px solid #0ff;border-radius:50%;font-size:36px;display:flex;align-items:center;justify-content:center">✈️</div><div style="background:#f06;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;margin-top:-6px">LIMITED</div></div><div style="position:absolute;left:20px;top:130px"><div style="width:70px;height:70px;background:#fc0;border-radius:50%;font-size:36px;display:flex;align-items:center;justify-content:center">🐤</div><div style="background:#000;border:1px solid #fff;border-radius:20px;font-size:11px;margin-top:-8px">🎖️ 0</div></div><div style="position:absolute;right:20px;top:130px"><div style="width:70px;height:70px;background:#000;border:1px solid red;border-radius:12px;font-size:32px;display:flex;align-items:center;justify-content:center">🚗</div><div style="background:#f06;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;margin-top:-6px">LIMITED</div></div></div>
<div style="padding:0 24px"><button style="width:100%;background:#fff;color:#000;font-weight:900;padding:16px;border-radius:16px;font-size:18px">⬢ Start Build</button></div>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0">
<button onclick="wallet.style.display='none';build.style.display='block'" style="background:none;border:none;color:#888">Build</button>
<button style="background:none;border:none;color:#888">Bag</button>
<button style="background:none;border:none;color:#888">Market</button>
<button style="background:none;border:none;color:#888">Earn</button>
<button style="background:none;border:none;color:#888">Friends</button>
<button onclick="build.style.display='none';wallet.style.display='block'" style="background:none;border:none;color:#fff">Wallet</button>
</div>

</body>
</html>
