<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel World</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial;
}
header {
  background: #1b2b43;
  padding: 20px;
  display: flex;
  justify-content: space-between;
}
h1 {font-size: 23px;}
.card {
  background: #1b2b43;
  margin: 15px;
  padding: 20px;
  border-radius: 15px;
}
button {
  background: #42c486;
  color: #071b13;
  border: none;
  padding: 13px 20px;
  border-radius: 10px;
  font-weight: bold;
}
#grid {
  display: grid;
  grid-template-columns: repeat(10,1fr);
  gap: 3px;
}
.cell {
  background: #344b68;
  aspect-ratio: 1;
  border-radius: 4px;
}
.cell.active {background: #42c486;}
</style></head><body><header>
<h1>🧊 Voxel World</h1>
<h3>💎 <span id="balance">300</span></h3>
</header><div class="card">
<h2>Welcome to Voxel World</h2>
<p>Your starting balance: 300 Voxels</p>
<button onclick="startBuild()">Start Build</button>
</div><div class="card" id="builder" style="display:none">
<h2>Build Your World</h2>
<p>Tap blocks to build.</p>
<div id="grid"></div>
<br>
<button onclick="saveBuild()">Save Build</button>
</div><div class="card">
<h2>My Builds</h2>
<div id="myBuilds">No builds yet.</div>
</div><div class="card">
<h2>Market</h2>
<div id="market">No items listed.</div>
</div><script>

let voxels = 300;
let builds = [];
let grid = [];

const telegram = window.TeleGRAM?.WebApp;
if (window.Telegram?.WebApp) {
 Telegram.WebApp.ready();
 Telegram.WebApp.expand();
}

function updateBalance() {
 document.getElementById("balance").innerText = voxels;
}

function startBuild() {
 document.getElementById("builder").style.display = "block";
 createGrid();
}

function createGrid() {
 let area = document.getElementById("grid");
 area.innerHTML = "";
 grid = [];

 for(let i=0;i<100;i++) {
  let block = document.createElement("div");
  block.className = "cell";
  block.onclick = function() {
   if(!block.classList.contains("active") && voxels > 0) {
    block.classList.add("active");
    voxels--;
   } else if(block.classList.contains("active")) {
    block.classList.remove("active");
    voxels++;
   }
   updateBalance();
  };
  grid.push(block);
  area.appendChild(block);
 }
}

function saveBuild() {
 let count = grid.filter(b => b.classList.contains("active")).length;

 if(count === 0) {
  alert("Build something first!");
  return;
 }

 let build = {
  name: "Voxel Build " + (builds.length+1),
  blocks: count
 };

 builds.push(build);

 document.getElementById("myBuilds").innerHTML =
 builds.map((b,i) =>
 `<p>${b.name} - ${b.blocks} Blocks
 <button onclick="sellBuild(${i})">Sell</button></p>`
 ).join("");
}

function sellBuild(i) {
 let build = builds[i];

 document.getElementById("market").innerHTML +=
 <p>🧊 ${build.name} - ${build.blocks} Blocks</p>;

 builds.splice(i,1);
 alert("Listed in Market!");
}

updateBalance();

</script></body>
</html>
